plugins {
    id 'java'
    id 'idea'
}

group = 'me.frep.vulcan'
version = '2.9.7.28'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
    maven { url = 'https://repo.opencollab.dev/main/' }
    maven { url = 'https://repo.md-5.net/content/repositories/releases/' }
    maven { url = 'https://nexus.neetgames.com/repository/maven-snapshots/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'com.github.retrooper:packetevents-spigot:2.14.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'org.geysermc.floodgate:api:2.2.4-SNAPSHOT'
    compileOnly 'com.google.guava:guava:33.4.0-jre'
    compileOnly 'com.google.code.gson:gson:2.11.0'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly('com.gmail.nossr50.mcMMO:mcMMO:2.3.003-SNAPSHOT') { transitive = false }
    implementation 'org.apache.commons:commons-lang3:3.17.0'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}
